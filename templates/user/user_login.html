{% extends "base.html" %}
{% block title %}User Login | SmartCart{% endblock %}
{% block content %}
<section class="card auth-card">
    <span class="eyebrow">Welcome back</span>
    <h1>User login</h1>
    <p class="page-subtitle">Sign in to access your SmartCart dashboard.</p>
    <form method="post" action="{{ url_for('user_login') }}">
        <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="field" style="display: flex; justify-content: space-between; align-items: center; margin: 12px 0 20px; flex-wrap: wrap; gap: 10px;">
            <label for="remember" style="display: flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; margin: 0;">
                <input id="remember" name="remember" type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--primary);">
                <span>Remember me on this device</span>
            </label>
            <a href="{{ url_for('forgot_password', role='user') }}" style="font-size: 0.85rem;">Forgot Password?</a>
        </div>
        <button type="submit">Login</button>
    </form>
    <p class="auth-switch">New to SmartCart? <a href="{{ url_for('user_register') }}">Create an account</a>.</p>
</section>
{% endblock %}
